- id: system-prompt
  config:
    includeRuntimeContext: false
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''
- id: tools
  config:
    mode: native
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: agent-default-model
  config:
    provider: rulith-model
    model: !!js process.env.RULITH_DSH_MODEL
- id: llm-pi-ai
  config:
    providers:
      rulith-model:
        api: openai-completions
        apiKeyEnv: RULITH_MODEL_KEY
        baseURL: !!js process.env.RULITH_DSH_MODEL_BASE
        compat:
          thinkingFormat: deepseek
        models:
          - id: !!js process.env.RULITH_DSH_MODEL
            contextWindow: 1000000
- insert:
    - id: rulith-mcp
      name: ./rulith-mcp.mjs
    - id: rulith-gate
      name: ./rulith-gate.mjs
- id: headless-runner
  inject: [headlessStartup, rulithGate]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: !!js ctx.headlessStartup.sessionId
    json: !!js ctx.headlessStartup.json
