- id: agent-preset-registry
  config:
    default: rulith
- id: system-prompt
  config:
    includeRuntimeContext: false
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''
- id: tools
  config:
    mode: native
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1
- id: agent-default-model
  config:
    provider: rulith-model
    model: !!js process.env.RULITH_DSH_MODEL
- id: llm-pi-ai
  config:
    providers:
      rulith-model:
        api: openai-completions
        apiKeyEnv: RULITH_MODEL_KEY
        baseURL: !!js process.env.RULITH_DSH_MODEL_BASE
        compat:
          thinkingFormat: deepseek
        models:
          - id: !!js process.env.RULITH_DSH_MODEL
            contextWindow: 1000000
- insert:
    - id: rulith-runtime
      name: ./rulith-runtime.mjs
      config:
        managerHome: !!js process.env.RULITH_DSH_MANAGER_HOME
        managerPort: !!js process.env.RULITH_DSH_MANAGER_PORT
        keyFile: !!js process.env.RULITH_DSH_KEY_FILE
        runtimeEntry: !!js process.env.RULITH_DSH_RUNTIME_ENTRY
        agentName: !!js process.env.RULITH_DSH_AGENT
        consoleUrl: !!js process.env.RULITH_DSH_CONSOLE_URL
        mcpUrl: !!js process.env.RULITH_DSH_MCP_URL
    - id: rulith-web-gate
      name: ./rulith-web-gate.mjs
      config:
        persona: !!js process.env.RULITH_DSH_PERSONA
    - id: rulith-dsh-ui
      name: rulith-dsh-ui
    # The only agent preset: no agent-layer plugins. dsh's stock presets carry their own shell, file, web and
    # subagent tools at the agent layer, which a global tool restriction does not reach, so they stay off.
    - id: preset-rulith
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rulith
        order: 0
        plugins: []
